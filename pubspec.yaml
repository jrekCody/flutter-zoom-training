name: flutter_zoom
description: "A flutter zoom clone application."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.3.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  go_router: ^13.2.1
  firebase_core: ^2.27.1
  firebase_auth: ^4.17.9
  cloud_firestore: ^4.15.9
  google_sign_in: ^6.2.1
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  jitsi_meet_flutter_sdk: ^0.2.2
  intl: ^0.19.0
  injectable: ^2.4.1
  get_it: ^7.6.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner:
  flutter_gen_runner:
  injectable_generator: ^2.6.1
  mockito: ^5.4.4
  mocktail: ^1.0.3
  fake_cloud_firestore: ^2.4.9
  firebase_auth_mocks: ^0.13.0
  google_sign_in_mocks: ^0.3.0
  bloc_test: ^9.1.7
  flutter_lints: ^3.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/image/

  fonts:
    - family: Lato
      fonts:
        - asset: assets/font/Lato-Black.ttf
        - asset: assets/font/Lato-Bold.ttf
        - asset: assets/font/Lato-Light.ttf
        - asset: assets/font/Lato-Regular.ttf
